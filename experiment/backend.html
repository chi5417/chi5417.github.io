<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交數據</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: black;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }
        .button-group {
            text-align: center;
        }
        button {
            padding: 10px 15px;
            border: none;
            background-color: #dc3545;
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>提交數據</h1>
    <table>
        <thead>
            <tr>
                <th>編號</th>
                <th>評分1</th>
                <th>評分2</th>
            </tr>
        </thead>
        <tbody id="dataBody">
            <!-- 數據將顯示在這裡 -->
        </tbody>
    </table>
    <div class="button-group">
        <button onclick="clearData()">清除所有數據</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const allData = JSON.parse(localStorage.getItem('allFormData')) || [];
            const tableBody = document.getElementById('dataBody');
            allData.forEach(data => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${data.id}</td>
                    <td>${data.scale1}</td>
                    <td>${data.scale2}</td>
                `;
                tableBody.appendChild(row);
            });
        });

        function clearData() {
            localStorage.removeItem('allFormData');
            document.getElementById('dataBody').innerHTML = '';
            alert('所有數據已清除');
        }
    </script>
</body>
</html>
