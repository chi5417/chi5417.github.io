<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>噪音攻擊 - 後端數據</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            border: none;
            background-color: #007BFF;
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
        }
        button:last-child {
            background-color: #dc3545;
        }
        h1 {
            margin-bottom: 20px;
        }
        .data-entry {
            text-align: left;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>噪音攻擊後端數據</h1>
        <div id="dataList"></div>
        <div class="button-group">
            <button onclick="confirmClearData()">清除數據</button>
        </div>
    </div>

    <script>
        function loadData() {
            const dataList = document.getElementById('dataList');
            const allData = JSON.parse(localStorage.getItem('allFormData')) || [];
            
            dataList.innerHTML = '';
            allData.forEach(data => {
                const dataEntry = document.createElement('div');
                dataEntry.classList.add('data-entry');
                dataEntry.textContent = `實驗參與者編號: ${data.id}, 噪音強度: ${data.scale1}, 持續秒數: ${data.scale2}`;
                dataList.appendChild(dataEntry);
            });
        }

        function confirmClearData() {
            if (confirm('是否確定清除所有數據？')) {
                clearData();
            }
        }

        function clearData() {
            localStorage.removeItem('allFormData');
            loadData();
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
