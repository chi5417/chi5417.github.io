<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>噪音攻擊</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .info-text {
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        input[type="range"] {
            width: 100%;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            border: none;
            background-color: #007BFF;
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
        }
        button:disabled {
            background-color: #ccc;
        }
        button:last-child {
            background-color: #dc3545;
        }
        h1 {
            cursor: pointer;
        }
        .error-message {
            color: red;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 onclick="playAudio()">噪音攻擊</h1>
        <form id="dataForm">
            <div class="form-group">
                <label for="id">實驗參與者編號：</label>
                <input type="text" id="id" name="id" required>
            </div>
            <div class="info-text">
                噪音強度1：極輕微噪音（對人體無害）<br>
                噪音強度5：點擊上方標題「噪音攻擊」聆聽<br>
                噪音強度10：極吵雜噪音（造成暫時性失聰）
            </div>
            <hr>
            <div class="form-group">
                <label for="scale1">給予對方的噪音強度（1到10）：</label>
                <input type="range" id="scale1" name="scale1" min="1" max="10" step="1" value="5" oninput="document.getElementById('scale1Value').innerText = this.value">
                <span id="scale1Value">5</span>
            </div>
            <div class="form-group">
                <label for="scale2">想使噪音持續幾秒（1到5）：</label>
                <input type="range" id="scale2" name="scale2" min="1" max="5" step="1" value="3" oninput="document.getElementById('scale2Value').innerText = this.value">
                <span id="scale2Value">3</span>
            </div>
            <div class="error-message" id="errorMessage" style="display: none;">請填寫所有欄位</div>
            <div class="button-group">
                <button type="button" onclick="handleSubmit()">提交</button>
                <button type="reset">重設</button>
            </div>
        </form>
    </div>

    <audio id="noiseAudio" src="noiseAudio.mp3" preload="auto"></audio>

    <script>
        function playAudio() {
            const audio = document.getElementById('noiseAudio');
            audio.play();
        }

        function handleSubmit() {
            const id = document.getElementById('id').value;
            const scale1 = document.getElementById('scale1').value;
            const scale2 = document.getElementById('scale2').value;
            const errorMessage = document.getElementById('errorMessage');
            
            if (!id) {
                errorMessage.style.display = 'block';
                return;
            }

            errorMessage.style.display = 'none';
            
            const data = {
                id: id,
                scale1: scale1,
                scale2: scale2
            };
            
            console.log('提交的數據：', data);

            // 從本地存儲中讀取現有的數據數組
            let allData = JSON.parse(localStorage.getItem('allFormData')) || [];
            
            // 將新數據添加到數組中
            allData.push(data);
            
            // 更新本地存儲
            localStorage.setItem('allFormData', JSON.stringify(allData));
            
            alert('資料已提交');
        }
    </script>
</body>
</html>
