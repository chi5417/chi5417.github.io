<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資料填寫</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 300px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        input[type="range"] {
            width: 100%;
        }
        button {
            padding: 10px 15px;
            margin-right: 10px;
            border: none;
            background-color: #007BFF;
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
        }
        button:disabled {
            background-color: #ccc;
        }
        button:last-child {
            background-color: #dc3545;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://unpkg.com/react/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/react-hook-form/dist/index.umd.js"></script>
    <script type="text/babel">

        const { useState, useEffect } = React;
        const { useForm } = ReactHookForm;

        function App() {
            const { register, handleSubmit, reset } = useForm();
            const [currentTime, setCurrentTime] = useState(new Date().toLocaleString());

            useEffect(() => {
                const interval = setInterval(() => {
                    setCurrentTime(new Date().toLocaleString());
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            const onSubmit = (data) => {
                fetch('https://your-backend-api.com/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Success:', data);
                    alert('資料已提交');
                    reset();
                })
                .catch((error) => {
                    console.error('Error:', error);
                    alert('提交失敗');
                });
            };

            const handleReset = () => {
                reset({
                    name: '',
                    rating: 6,
                    secondRating: 3
                });
            };

            return (
                <div className="container">
                    <div className="form-group">
                        <label>現在時間：</label>
                        <div>{currentTime}</div>
                    </div>
                    <form onSubmit={handleSubmit(onSubmit)}>
                        <div className="form-group">
                            <label htmlFor="name">姓名：</label>
                            <input type="text" id="name" name="name" ref={register} />
                        </div>
                        <div className="form-group">
                            <label htmlFor="rating">請選擇一個選項 (1 到 10)：</label>
                            <input type="range" id="rating" name="rating" min="1" max="10" step="1" defaultValue="6" ref={register} onInput={(e) => e.target.nextElementSibling.value = e.target.value} />
                            <output>6</output>
                        </div>
                        <div className="form-group">
                            <label htmlFor="secondRating">請選擇另一個選項 (1 到 5)：</label>
                            <input type="range" id="secondRating" name="secondRating" min="1" max="5" step="1" style="background-color: #ff6347;" defaultValue="3" ref={register} onInput={(e) => e.target.nextElementSibling.value = e.target.value} />
                            <output>3</output>
                        </div>
                        <button type="submit">提交</button>
                        <button type="button" onClick={handleReset}>重設</button>
                    </form>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
