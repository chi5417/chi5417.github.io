<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資料填寫</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 300px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        input[type="range"] {
            width: 100%;
        }
        button {
            padding: 10px 15px;
            margin-right: 10px;
            border: none;
            background-color: #007BFF;
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
        }
        button:disabled {
            background-color: #ccc;
        }
        button:last-child {
            background-color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-group">
            <label>現在時間：</label>
            <div id="current-time"></div>
        </div>
        <form id="contact-form" action="send_mail.php" method="POST">
            <div class="form-group">
                <label for="name">姓名：</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="rating">請選擇一個選項 (1 到 10)：</label>
                <input type="range" id="rating" name="rating" min="1" max="10" step="1" defaultValue="6" oninput="this.nextElementSibling.value = this.value">
                <output>6</output>
            </div>
            <div class="form-group">
                <label for="secondRating">請選擇另一個選項 (1 到 5)：</label>
                <input type="range" id="secondRating" name="secondRating" min="1" max="5" step="1" style="background-color: #ff6347;" defaultValue="3" oninput="this.nextElementSibling.value = this.value">
                <output>3</output>
            </div>
            <button type="submit">提交</button>
            <button type="reset">重設</button>
        </form>
    </div>

    <script>
        function updateTime() {
            document.getElementById('current-time').textContent = new Date().toLocaleString();
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
